services:
  video-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localwan-video-studio
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - ./data:/app/data
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - SKYREELS_I2V_MODEL_ID=/models/SkyReels-V2-I2V-1.3B-540P-Diffusers
      - SKYREELS_DF_MODEL_ID=/models/SkyReels-V2-DF-1.3B-540P-Diffusers
      - DEFAULT_OFFLOAD_MODE=auto
      - HF_HOME=/models/.cache/huggingface
      - FFMPEG_CRF=18
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  model-downloader:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - tools
    volumes:
      - ./models:/models
    command: python /app/scripts/download-models.py
