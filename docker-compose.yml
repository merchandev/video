services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: localwan-api
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - ./data:/app/data
    environment:
      - COMFYUI_URL=http://comfyui:8188
    depends_on:
      - comfyui
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  comfyui:
    build:
      context: .
      dockerfile: docker/comfyui.Dockerfile
    container_name: localwan-comfyui
    expose:
      - "8188"
    volumes:
      - ./models:/opt/comfyui/models
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 3

  model-downloader:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles:
      - tools
    volumes:
      - ./models:/models
    command: python /app/scripts/download-models.py
    environment:
      - MODEL_DIR=/models/Wan2.2-TI2V-5B
