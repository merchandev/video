<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCAL VIDEO STUDIO</title>
    <meta name="description" content="Generador de video local avanzado - SkyReels V2">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-background"></div>
    <div class="app-container">
        <header>
            <h1>LOCAL VIDEO <span class="accent">STUDIO</span></h1>
            <p>Engine: SkyReels V2</p>
        </header>

        <main class="main-content">
            <section class="config-panel glass-panel">
                <h2>Configuración</h2>
                <form id="generate-form">
                    
                    <div class="form-group">
                        <label for="mode">Modo</label>
                        <select id="mode" name="mode">
                            <option value="i2v">Imagen → Video</option>
                            <option value="t2v">Texto → Video</option>
                            <option value="first_last">Primer frame → último frame</option>
                            <option value="extend">Extender video</option>
                            <option value="storyboard">Storyboard (Múltiples Imágenes)</option>
                        </select>
                    </div>

                    <div class="form-group" id="group-image">
                        <label for="image">Imágenes iniciales (Hasta 20)</label>
                        <div class="file-drop-area">
                            <span class="file-msg" id="msg-image">Arrastra tus imágenes o haz clic aquí</span>
                            <input class="file-input" type="file" id="image" name="image" accept="image/*" multiple>
                        </div>
                    </div>

                    <div class="form-group hidden" id="group-end-image">
                        <label for="end_image">Imágenes finales (Opcional, igual cantidad)</label>
                        <div class="file-drop-area">
                            <span class="file-msg" id="msg-end-image">Sube las imágenes de destino...</span>
                            <input class="file-input" type="file" id="end_image" name="end_image" accept="image/*" multiple>
                        </div>
                    </div>

                    <div class="form-group hidden" id="group-video">
                        <label for="video">Videos base a extender (Hasta 20)</label>
                        <div class="file-drop-area">
                            <span class="file-msg" id="msg-video">Sube los MP4 base...</span>
                            <input class="file-input" type="file" id="video" name="video" accept="video/mp4" multiple>
                        </div>
                    </div>

                    <div class="form-group hidden" id="group-storyboard">
                        <label for="storyboard_images">Imágenes clave (Storyboard en orden)</label>
                        <div class="file-drop-area">
                            <span class="file-msg" id="msg-storyboard-images">Sube 2 o más imágenes para interpolar...</span>
                            <input class="file-input" type="file" id="storyboard_images" name="storyboard_images" accept="image/*" multiple>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="prompt">Prompt</label>
                        <textarea id="prompt" name="prompt" rows="3" placeholder="Describe la escena..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="negative_prompt">Negative Prompt</label>
                        <textarea id="negative_prompt" name="negative_prompt" rows="2">色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走</textarea>
                    </div>

                    <div class="row">
                        <div class="form-group half">
                            <label for="profile">Perfil</label>
                            <select id="profile" name="profile">
                                <option value="extreme">RTX 3050 / Extreme</option>
                                <option value="low">Low VRAM</option>
                                <option value="native">Native (Alta Calidad)</option>
                            </select>
                        </div>
                        <div class="form-group half">
                            <label for="orientation">Orientación</label>
                            <select id="orientation" name="orientation">
                                <option value="horizontal">Horizontal (16:9)</option>
                                <option value="vertical">Vertical (9:16)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="duration_seconds">Duración (segundos)</label>
                        <input type="number" id="duration_seconds" name="duration_seconds" value="4" min="1" max="15">
                    </div>

                    <div class="advanced-settings-toggle" id="advanced-toggle">
                        <span>Opciones Avanzadas (Diffusion Forcing)</span>
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>

                    <div class="advanced-settings" id="advanced-settings">
                        <div class="row">
                            <div class="form-group half">
                                <label for="seed">Seed (-1 = Random)</label>
                                <input type="number" id="seed" name="seed" value="-1">
                            </div>
                            <div class="form-group half">
                                <label for="ar_step">AR Step</label>
                                <input type="number" id="ar_step" name="ar_step" value="0">
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group half">
                                <label for="overlap_history">Overlap History</label>
                                <input type="number" id="overlap_history" name="overlap_history" value="17">
                            </div>
                            <div class="form-group half">
                                <label for="addnoise_condition">Addnoise Condition</label>
                                <input type="number" id="addnoise_condition" name="addnoise_condition" value="20" max="60">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" id="generate-btn">
                        GENERAR VIDEOS
                        <span class="btn-glow"></span>
                    </button>
                </form>
            </section>

            <section class="preview-panel glass-panel">
                <div class="status-container" id="status-container">
                    <div class="empty-state" id="empty-state">
                        <svg viewBox="0 0 24 24" width="48" height="48" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
                        <p>Los videos generados aparecerán aquí en cola</p>
                    </div>
                    
                    <div class="jobs-grid hidden" id="jobs-grid">
                        <!-- Las tarjetas de trabajos individuales se insertarán aquí dinámicamente -->
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
